[package]
name = "styx-http"
description = "Styx: 极小的 HTTP 客户端（标准库明文 + 可选 rustls HTTPS），不引入异步运行时"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["tls"]
# HTTPS 支持。关掉它可以得到一个只依赖标准库、纯离线可编译的构建，
# 用于对接本机 http:// 上的自建模型服务（Ollama / LM Studio / vLLM / one-api…）。
tls = ["dep:ureq"]

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

# 版本下限卡在 2.12：更早的 2.x 拉的是 rustls 0.21 → rustls-webpki 0.101.x，
# 那一条线上有三个已知漏洞（含一个 high：畸形 CRL 触发 panic 的 DoS）。
# 2.12 用 rustls 0.23 → rustls-webpki 0.103.x，修补版本就在这条线上。
#
# **不要**在 features 里加 `webpki-roots`。它在 ureq 2.8 是个独立 feature，
# 但从 2.9 起被折进了 `tls`（`tls = ["dep:webpki-roots", "dep:rustls", ...]`），
# 于是再写一遍就成了一个不存在的 feature——cargo 的报错是"解析不出 ureq 的
# 版本"，看起来像版本冲突，实际是**悄悄退回 2.8.0**，把上面那个漏洞带了回来。
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }
